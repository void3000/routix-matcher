[package]
name = "routix-matcher"
build = "build.rs"
version = "0.1.0"
edition = "2024"

[dependencies]
routix-rust-clients = { path = "../routix-rust-clients" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["trace"] }
routix-engine = "0.1.0"
arc-swap = "1.7.1"
serde = { version = "1.0.219", features = ["derive"] }
surrealdb = "2.3.7"
bb8 = "0.9.0"
async-trait = "0.1.88"
serde_json = "1.0.142"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lapin = "3.7.2"

[build-dependencies]
tonic-build = "0.12"
